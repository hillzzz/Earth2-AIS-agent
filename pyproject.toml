[project]
name = "earth2-maritime-agent"
version = "0.1.0"
description = "MCP tools for a long-running maritime agent: NVIDIA Earth2Studio storm/gale forecasts, a live AIS feed with historical vessel-gap detection, and a bridge that pushes GRIB2 forecasts straight into a running OpenCPN instance - built for Hermes (or any other MCP-speaking tool-calling agent)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Earth2Studio core + prognostic models.
    #   fcn / fcn3        - global deterministic baseline (25km / ~0.25 deg)
    #   graphcast         - DeepMind global model, strong medium-range skill
    #   aurora            - Microsoft global model
    #   dlwp / dlesym      - lightweight global models, cheap ensembles
    # Earth2Studio diagnostics.
    #   cbottle            - CBottleInfill + CBottleSR: variable completion and
    #                        harbor-scale (5-10km) regional super-resolution
    #   windgust-afno      - AFNO wind-gust diagnostic, drives gale/storm warnings
    #   stormscope         - StormScopeMeteosatEU: European-domain satellite
    #                        nowcasting (the nowcast tier's primary model)
    # Earth2Studio extras.
    #   data               - CDS/ECMWF/EUMETSAT data sources (better European skill
    #                        than GFS alone) and satellite observation readers
    #   perturbation       - ensemble perturbation utilities for probabilistic risk
    # NOTE: earth2studio's "cyclone" extra (TempestExtremes TC tracking) is
    # deliberately left out - it needs cupy-cuda13x/cucim-cu13, which conflict
    # with a CUDA13.0 torch build (see the nvidia-* pins below). gale_warnings.py
    # implements its own MSLP-minima storm tracker instead (pure numpy/scipy, no
    # GPU dependency, and better suited to extratropical windstorms than a
    # TC-tracking algorithm anyway).
    "earth2studio[aurora,dlesym,dlwp,fcn,fcn3,graphcast,cbottle,windgust-afno,stormscope,data,perturbation]",
    # torch-harmonics is pulled in transitively (git-pinned by earth2studio
    # itself for the fcn3/perturbation extras) - do not pin it separately
    # here, that creates a conflicting second source for the same package.
    # forecast_engine.py's coastline/fetch-limited-wave lookup, and
    # ais_mcp_server.py / fetch_cable_data.py's cable-proximity geometry.
    "cartopy>=0.23",
    "shapely>=2.0",
    # opencpn_bridge.py's GRIB2 push to the machine running OpenCPN.
    "paramiko>=3.4",
    "requests>=2.32",
    # mcp_server.py / ais_mcp_server.py expose these tools to Hermes (or any
    # other MCP client) - see each file's own docstring for `hermes mcp add`.
    "mcp>=2.2.0",
    # ais_ingest.py's aisstream.io WebSocket subscription.
    "websockets>=17.1",
]

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "0.18.0" }

# earth2studio's own [tool.uv] build config (no-build-isolation-package /
# extra-build-dependencies) only applies inside its own repo - it does not
# propagate to a consuming project, so we mirror it here. Without this,
# torch-harmonics/earth2grid/natten/flash-attn fail to build: their setup.py
# needs `torch` importable at build time, which an isolated build env won't
# have.
[tool.uv]
no-build-isolation-package = ["earth2grid", "flash-attn", "natten", "torch-harmonics"]

[tool.uv.extra-build-dependencies]
earth2grid = ["setuptools", "torch"]
flash-attn = ["torch", "packaging", "ninja"]
natten = ["setuptools", "cmake", "torch"]

# ---------------------------------------------------------------------------
# A NOTE ON TORCH / CUDA, IF YOU HIT A BUILD OR IMPORT ERROR
#
# This project was built and tested on a Grace Blackwell GB10 (aarch64,
# CUDA 13.0) dev kit, where PyPI's generic "torch" wheel doesn't match the
# machine's real installed build closely enough for uv's resolver to get the
# nvidia-*-cu13 runtime library versions right on its own - the fix there was
# pinning every nvidia-* package to exactly what the installed torch build's
# own METADATA (Requires-Dist) declared. That's NOT included here, since
# those exact pins are almost certainly wrong for your machine and would
# just replace one broken resolution with a different broken one.
#
# On a more typical x86_64 CUDA machine you likely don't need any of this -
# just `uv sync` and see whether torch/earth2studio import cleanly. If you
# hit an nvidia-*-cu13 version mismatch on an unusual platform (aarch64,
# a newer/older CUDA than the wheel expects, etc.), the fix is: check what
# your actually-installed torch build declares
# (`python -c "import importlib.metadata as m; print(m.metadata('torch').get_all('Requires-Dist'))"`
# filtered to nvidia-* entries) and add matching `nvidia-...==<version>`
# pins to `dependencies` above.
# ---------------------------------------------------------------------------
